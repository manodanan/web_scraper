[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-finder"
version = "1.0.0"
description = "Machine Learning Powered Application Backend & API Finder CLI"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "beautifulsoup4",
    "playwright",
    "scikit-learn",
    "numpy",
    "joblib"
]

[project.scripts]
backend-finder = "backend_finder:main"
backend_finder = "backend_finder:main"

[tool.setuptools]
py-modules = ["backend_finder", "ml_backend_classifier"]
